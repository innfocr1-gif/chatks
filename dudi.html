<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<title>ChatKS - Dudi AI Pro</title>
<style>
body{background:#111;color:white;font-family:'Segoe UI',sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
#chat{width:90%;max-width:600px;height:80vh;background:#1e1e1e;border-radius:15px;display:flex;flex-direction:column;box-shadow:0 0 20px rgba(0,0,0,0.5)}
#messages{flex:1;overflow-y:auto;padding:15px}
.user{text-align:right;background:#4CAF50;padding:10px 14px;border-radius:12px;margin:6px 0;max-width:80%;margin-left:auto}
.bot{text-align:left;background:#333;padding:10px 14px;border-radius:12px;margin:6px 0;max-width:80%;white-space:pre-wrap}
.input-area{display:flex;padding:12px;border-top:1px solid #444}
#userInput{flex:1;background:#2a2a2a;color:white;border:none;padding:12px;border-radius:8px;outline:none}
#sendBtn{background:#4CAF50;color:white;border:none;padding:12px 22px;margin-left:10px;border-radius:8px;cursor:pointer;font-weight:bold}
#sendBtn:hover{background:#45a049}
</style>
</head>
<body>
<div id="chat">
  <div id="messages">
    <div class="bot">Pershendetje! Une jam ChatKS 😊</div>
  </div>
  <div class="input-area">
    <input type="text" id="userInput" placeholder="Shkruaj ketu...">
    <button id="sendBtn">Dergo</button>
  </div>
</div>

<script>
// MOS E HARRRO: VENDOSE API KEY TEND KETU
const API_KEY = "";

const messagesDiv = document.getElementById('messages');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');

sendBtn.addEventListener('click', sendMessage);
userInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') sendMessage(); });

async function sendMessage() {
  const text = userInput.value.trim();
  if(!text) return;
  addMessage(text, 'user');
  userInput.value = '';
  addMessage('Po mendoj...', 'bot', true);

  const pyetja = text.toLowerCase();

  // 1. PER KRIJUESIN
  if(pyetja.includes("kush te krijoi") || pyetja.includes("kush te beri") || pyetja.includes("kush te ndertoi") || pyetja.includes("kush te programoi")){
    updateLastBotMessage("Mua më ndërtoi Programeri Shkëlqim Limanaj nga Caraviku i Klinës. Ai pohon se njerëzit mund të jenë vetëm ndërtues e jo krijues. Krijues është vetëm Allahu i Madhëruar, ndërsa ne krijesat zbulojmë. Dhe çdo gjë që ndërtojmë, së pari e kemi prototip krijimtarinë e Allahut. ✨");
    return;
  }

  // 2. PER PERSHENDETJE
  if(pyetja.includes("pershendetje") || pyetja.includes("salam") || pyetja.includes("tung") || pyetja.includes("hello")){
    updateLastBotMessage("Pershendetje! Une jam ChatKS 😊\n\n---\nCHATKS u ndërtua nga Programeri Shkëlqim Limanaj");
    return;
  }

  try {
    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({contents: [{parts: [{text: text}]}]})
    });

    if(!response.ok) throw new Error("API Key gabim ose s'ka internet");

    const data = await response.json();
    const botReply = data.candidates[0].content.parts[0].text;
    // 3. NENTITULL NE CDO PERGJIGJE TJETER
    const pergjigjaFinale = botReply + "\n\n---\n*CHATKS u ndërtua nga Programeri Shkëlqim Limanaj*";
    updateLastBotMessage(pergjigjaFinale);
  } catch (error) {
    updateLastBotMessage('Gabim: ' + error.message + '. Kontrollo API Key dhe internetin.');
  }
}

function addMessage(text, sender, isLoading=false) {
  const msg = document.createElement('div');
  msg.className = sender;
  msg.innerText = text;
  if(isLoading) msg.id = 'loading';
  messagesDiv.appendChild(msg);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}
function updateLastBotMessage(text) {
  const loadingMsg = document.getElementById('loading');
  if(loadingMsg){
    loadingMsg.innerText = text;
    loadingMsg.id = '';
  }
}
</script>
</body>
</html>
